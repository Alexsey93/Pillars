[project]
name = "pillars-frontend"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flet",
    "requests",
    "flet-geolocator",
    "flet-map",
    "openpyxl",
    "flet-camera",
    "flet-permission-handler",
    "httpx",
    "certifi",
    "packaging",
]

[tool.flet.app]
path = "."

[tool.flet.flutter.dependencies]
flet_camera = "*"
flet_geolocator = "*"
flet_map = "*"
flet_permission_handler = "*"

[tool.flet.python.dependencies]
requests = ">=2.32"
flet-geolocator = ">=0.1"
httpx = ">=0.27"
flet-permission-handler = "*"
flet-camera = "*"
flet-map = "*"
flet = "*"
certifi = "*"

[tool.flet.android]
extract_packages = ["flet_camera", "flet_permission_handler", "certifi"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
"android.permission.CAMERA" = true

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.setuptools.packages.find]
include = ["components*", "dialogs*", "views*"]