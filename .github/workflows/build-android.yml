name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  release:
    types: [published]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -dname "CN=Pillars, O=Pillars, C=RU" \
            -storepass pillarsecret \
            -keypass pillarsecret

      - name: Build APK
        working-directory: frontend
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          flet build apk \
            --build-version ${{ github.ref_name }} \
            --build-number ${{ github.run_number }} \
            --android-signing-key-store ../upload-keystore.jks \
            --android-signing-key-store-password pillarsecret \
            --android-signing-key-password pillarsecret \
            --android-signing-key-alias upload

      - name: Locate built APK
        id: locate_apk
        run: |
          APK=$(find frontend -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found after build"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pillars-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Автоматическая сборка APK из тега ${{ github.ref_name }}.
            Скачайте APK и установите на устройство для обновления приложения.
          draft: false
          prerelease: false